product: "LoRa Car Radio"
safety:
  current_limit_ma: 200
rails:
  - {name: "+5V", expected: 5.0, tol: 0.1, points: ["J3-1","U6-14..16"]}
  - {name: "+3V3", expected: 3.3, tol: 0.1, points: ["P2-2"]}
  - {name: "+3V3_RF", expected: 3.3, tol: 0.1, points: ["U12-1"]}
clocks:
  - {ref: "Y1", expected_mhz: 16.0}
  - {ref: "Y2", expected_mhz: 32.0}
programming:
  debug: "J-Link"
  serial:
    baud: 115200
    pins: {GND: "P2-1", RX: "P2-8 (PC-RX)", TX: "P2-10 (PC-TX)"}
functional_tests:
  - {cmd: "bit.lora", expect: "PASS"}
  - {cmd: "bit.gps",  expect: "PASS"}
  - {cmd: "bit.imu",  expect: "PASS"}
  - {cmd: "bit.i2c",  expect: "PASS"}